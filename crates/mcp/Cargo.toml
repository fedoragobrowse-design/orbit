[package]
name = "orbit-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
orbit-core = { path = "../core" }
orbit-audit = { path = "../audit" }
orbit-secrets = { path = "../secrets" }
orbit-model-router = { path = "../model-router" }
orbit-tools = { path = "../tools" }
rmcp = { version = "=3.4.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
