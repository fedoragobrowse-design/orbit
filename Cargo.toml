[workspace]
resolver = "2"
members = ["crates/core", "crates/audit", "crates/event-bus", "crates/api", "apps/server", "crates/secrets", "crates/model-router", "crates/policy", "crates/risk", "crates/approvals", "crates/tools", "crates/agent-runtime", "crates/task-runtime", "crates/aiec-runtime", "crates/computer-node-protocol", "crates/memory", "crates/scheduler", "crates/email", "crates/mcp", "apps/computer-node", "tests/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
futures-util = "0.3"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
reqwest = { version = "=0.13.2", default-features = false, features = ["rustls", "json", "stream"] }
serde_jcs = "0.1"
jsonschema = { version = "0.33", default-features = false }
http = "1"
sse-stream = "0.2"
tokio-util = "0.7"
base64 = "0.22"
mailparse = "0.16"
tokio-rustls = "0.26"
rustls-pemfile = "2"
webpki-roots = "1"
zeroize = "1"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
libc = "0.2"
notify = "8"
tempfile = "3"
unicode-normalization = "0.1"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.10"
hmac = "0.12"
