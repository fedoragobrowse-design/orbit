name: orbit
services:
  postgres:
    image: pgvector/pgvector:pg17
    command: ["-c", "shared_buffers=128MB", "-c", "max_connections=20", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB"]
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${ORBIT_DB_PASSWORD:?Set ORBIT_DB_PASSWORD in .env}
      ORBIT_APP_DB_PASSWORD: ${ORBIT_APP_DB_PASSWORD:?Set ORBIT_APP_DB_PASSWORD in .env}
      POSTGRES_DB: orbit
    volumes:
      - database:/var/lib/postgresql/data
      - ./deploy/docker/production-database.sh:/docker-entrypoint-initdb.d/10-orbit-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [orbit]
  server:
    build: {context: ., dockerfile: deploy/docker/server.Dockerfile}
    mem_limit: 512m
    cpus: 1.5
    environment:
      DATABASE_URL: postgres://orbit_runtime:${ORBIT_APP_DB_PASSWORD}@postgres:5432/orbit
      ORBIT_MIGRATION_DATABASE_URL: postgres://orbit:${ORBIT_DB_PASSWORD}@postgres:5432/orbit
      ORBIT_BIND: 0.0.0.0:3000
      ORBIT_KEY_DIR: /var/lib/orbit/keys
      ORBIT_ARTIFACT_DIR: /var/lib/orbit/artifacts
    volumes: ["keys:/var/lib/orbit/keys", "artifacts:/var/lib/orbit/artifacts"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000/ready]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [orbit]
  web:
    build: {context: ., dockerfile: deploy/docker/web.Dockerfile}
    mem_limit: 256m
    cpus: 1.0
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      server: {condition: service_healthy}
    restart: unless-stopped
    networks: [orbit]
  ollama:
    image: ollama/ollama:0.34.0
    profiles: [ollama]
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes: ["models:/root/.ollama"]
    restart: unless-stopped
    networks: [orbit]
  # Full profile only: Home Assistant the owner optionally enables. The Pi
  # profile omits it (memory). States sync as UNTRUSTED_EXTERNAL; Orbit never
  # actuates without a Confirm-gated owner approval.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    profiles: [full]
    mem_limit: 512m
    cpus: 1.0
    environment:
      TZ: ${TZ:-UTC}
    volumes: ["hass:/config"]
    restart: unless-stopped
    networks: [orbit]
networks:
  orbit: {}
volumes:
  database: {}
  keys: {}
  artifacts: {}
  models: {}
  hass: {}
